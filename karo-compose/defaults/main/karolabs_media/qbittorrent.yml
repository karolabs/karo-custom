---

karolabs_media_qbittorrent_enabled: false

karolabs_media_qbittorrent_stack_defaults: # -8<- [start:docs]
  qbittorrent:
    image: "{{ karolabs_qbittorrent_image }}"
    domain: "qbittorrent.{{ karo_compose_root_domain }}"
    downloads_path: "" # e.g. /media/drive1/data/torrents
    webui_enabled: true
  qui:
    image: "{{ karolabs_qui_image }}"
    domain: "qui.{{ karo_compose_root_domain }}"
    log_level: info # trace, debug, info, warn, error
    oidc_client_id: ""
    secrets:
      session_secret: "" # `openssl rand -hex 16`
      oidc_client_secret: ""
