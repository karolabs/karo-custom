---

karolabs_core_traefik_enabled: false

karolabs_core_traefik_stack_defaults:
  traefik:
    image: "{{ karolabs_traefik_image }}"
    log_level: debug # trace, debug, info, warn, error, fatal, panic
    acme_staging_enabled: true
    acme_email: cert@example.com
    acme_staging_ca_server_url: "https://acme-staging-v02.api.letsencrypt.org/directory" # -8<- [end:x]
    acme_live_ca_server_url: "https://acme-v02.api.letsencrypt.org/directory" # "https://acme.zerossl.com/v2/DV90" # -8<- [end:x]
    dashboard_enabled: true
    dashboard_forward_auth_enabled: true
    dashboard_domain: "traefik.{{ karo_compose_root_domain }}"
    custom_domains_raw: |
      # - main: "*.int.{{ karo_compose_root_domain }}"
    secrets:
      acme_zone_api_token: "" # cloudflare
      acme_dns_api_token: "" # cloudflare
  tinyauth:
    image: "{{ karolabs_tinyauth_image }}"
    domain: "tinyauth.{{ karo_compose_root_domain }}"
    log_level: info # trace, debug, info, warn, error, fatal, panic
    oidc_client_id: ""
    secrets:
      oidc_client_secret: ""
  cetusguard:
    image: "{{ karolabs_cetusguard_image }}"
    log_level: 6 # 0-7 (min to max verbosity)
