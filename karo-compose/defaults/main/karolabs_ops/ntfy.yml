---

karolabs_ops_ntfy_enabled: false

karolabs_ops_ntfy_stack_defaults:
  ntfy:
    image: "{{ karolabs_ntfy_image }}"
    domain: "ntfy.{{ karo_compose_root_domain }}"
    log_level: info # trace, debug, info, warn, error
    auth_users: "" # https://docs.ntfy.sh/config/#users-via-the-config
    auth_access: "" # https://docs.ntfy.sh/config/#acl-entries-via-the-config
    auth_tokens: "" # https://docs.ntfy.sh/config/#tokens-via-the-config
