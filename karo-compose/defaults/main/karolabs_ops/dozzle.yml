    image: docker.io/hectorm/cetusguard:v1.1.4@sha256:16a60a57943bb5ba4c3792c6b815cfb180f3492a7cabc469036ac1291c9c5365 # -8<- [end:x]
    log_level: 6 # 0-7 (min to max verbosity)
