---

karolabs_ops_dozzle_enabled: false

karolabs_ops_dozzle_stack_defaults:
  dozzle:
    image: "{{ karolabs_dozzle_image }}"
    domain: "dozzle.{{ karo_compose_root_domain }}"
    log_level: info # debug, info, warn, error
    host_label: "Homeserver"
    oidc_client_id: ""
    secrets:
      oidc_client_secret: ""
  cetusguard:
    image: "{{ karolabs_cetusguard_image }}"
    log_level: 6 # 0-7 (min to max verbosity)
