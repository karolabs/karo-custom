---

name: Prek checks

on:
  pull_request:
  # targeting
    branches:
      - '*'
  push:
  # made to
    branches:
      - main

jobs:
  prek:
    runs-on: ubuntu-latest
    steps:
      - name: Run actions/checkout # https://github.com/actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run j178/prek-action # https://github.com/j178/prek-action
        uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d # v3.1.0
